version: '3.9'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mapdata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mapdata}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "
        echo 'Waiting for database...';
        while ! python TowerMap/manage.py check --database default 2>/dev/null; do
          sleep 5;
          echo 'Still waiting...';
        done;
        python TowerMap/manage.py migrate;
        python TowerMap/manage.py load_sql;
        python TowerMap/manage.py create_default_superuser;
        python TowerMap/manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - ./dummy_towers.sql:/app/dummy_towers.sql
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:admin@db:5432/mapdata}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-mapdata}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      
      # Firebase Configuration
      FIREBASE_CREDENTIAL_JSON: ${FIREBASE_CREDENTIAL_JSON}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-https://towermap-b98ee-default-rtdb.firebaseio.com}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-Firebase/towermap-b98ee-firebase-adminsdk-fbsvc-d502a34283.json}
      
      # Django Secret Key
      SECRET_KEY: ${SECRET_KEY:-your-default-dev-secret-key}
      
      # Other Django settings
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,.onrender.com}
    env_file:
      - .env  # Optional: for local development

volumes:
  postgres_data:
